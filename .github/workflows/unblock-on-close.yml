name: Unblock on close

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  unblock:
    if: contains(github.event.issue.labels.*.name, 'blocked')
    runs-on: ubuntu-latest
    steps:
      - name: Remove blocked label and leave a note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit "$NUMBER" --repo "$REPO" --remove-label blocked
          gh issue comment "$NUMBER" --repo "$REPO" --body "Closed, so the blocked label was removed automatically."